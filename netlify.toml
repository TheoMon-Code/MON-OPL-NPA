[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker must always be revalidated
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Static assets: cache 1 week
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
